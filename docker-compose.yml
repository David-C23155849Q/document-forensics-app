version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example

  lecturer-dashboard:
    build: ./lecturer-dashboard
    ports:
      - "5173:5173"
    volumes:
      - ./lecturer-dashboard:/app
    depends_on:
      - backend
